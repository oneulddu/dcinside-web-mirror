<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            "use strict";

            var theme = "dark";
            var mediaBlockMode = "none";
            var mediaBlockModes = { none: true, dccon: true, body: true, all: true };
            try {
                theme = window.localStorage.getItem("mirror_theme_v1") === "light" ? "light" : "dark";
                var savedMediaBlockMode = window.localStorage.getItem("mirror_media_block_mode_v1");
                if (mediaBlockModes[savedMediaBlockMode]) {
                    mediaBlockMode = savedMediaBlockMode;
                } else if (window.localStorage.getItem("mirror_dccon_block_v1") === "1") {
                    mediaBlockMode = "dccon";
                }
            } catch (err) {
                theme = "dark";
                mediaBlockMode = "none";
            }

            var root = document.documentElement;
            root.dataset.theme = theme;
            root.dataset.mediaBlockMode = mediaBlockMode;
            root.dataset.dcconBlocked = mediaBlockMode === "dccon" || mediaBlockMode === "all" ? "true" : "false";
            root.style.colorScheme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ static_url('css/main.css') }}">
    <title>{{ title or "숨터" }}</title>
    {% if social_meta %}
    <meta property="og:site_name" content="{{ social_meta.site_name }}">
    <meta property="og:type" content="{{ social_meta.type }}">
    <meta property="og:title" content="{{ social_meta.title }}">
    <meta property="og:description" content="{{ social_meta.description }}">
    <meta property="og:url" content="{{ social_meta.url }}">
    <meta name="twitter:card" content="{{ social_meta.twitter_card }}">
    <meta name="twitter:title" content="{{ social_meta.title }}">
    <meta name="twitter:description" content="{{ social_meta.description }}">
    {% if social_meta.image %}
    <meta property="og:image" content="{{ social_meta.image }}">
    <meta property="og:image:secure_url" content="{{ social_meta.image }}">
    <meta property="og:image:alt" content="{{ social_meta.image_alt }}">
    <meta name="twitter:image" content="{{ social_meta.image }}">
    <meta name="twitter:image:alt" content="{{ social_meta.image_alt }}">
    {% endif %}
    {% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#content">본문 바로가기</a>
    <div class="shell">
        <header class="masthead">
            <div class="masthead-row">
                <div class="masthead-lead">
                    {% block masthead_lead %}
                    <a class="brand" href="/">
                        <span class="brand-name">숨터</span>
                    </a>
                    {% endblock %}
                </div>
                <div class="header-actions">
                    {% block masthead_actions %}{% endblock %}
                    <div class="media-block-control">
                        <button class="dccon-toggle" type="button" aria-label="이미지 차단 설정: 차단 없음" aria-haspopup="menu" aria-expanded="false" aria-controls="media-block-menu" title="이미지 차단 설정: 차단 없음">
                            <svg class="dccon-icon dccon-icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <rect x="3.5" y="4.5" width="17" height="15" rx="3"/>
                                <circle cx="9" cy="10" r="1.6"/>
                                <path d="M20.5 16l-4.5-4.5L7 19.5"/>
                            </svg>
                            <svg class="dccon-icon dccon-icon-block" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <rect x="3.5" y="4.5" width="17" height="15" rx="3"/>
                                <path d="M4.5 5.5l15 13"/>
                            </svg>
                        </button>
                        <div class="media-block-menu" id="media-block-menu" role="menu" aria-label="이미지 차단 범위" hidden>
                            <div class="media-block-menu-title">이미지 차단</div>
                            <button class="media-block-option" type="button" role="menuitemradio" aria-checked="true" data-media-block-mode="none">
                                <span class="media-block-option-name">차단 없음</span>
                                <span class="media-block-option-desc">모든 이미지 표시</span>
                            </button>
                            <button class="media-block-option" type="button" role="menuitemradio" aria-checked="false" data-media-block-mode="dccon">
                                <span class="media-block-option-name">이모티콘만</span>
                                <span class="media-block-option-desc">댓글·본문 이모티콘 차단</span>
                            </button>
                            <button class="media-block-option" type="button" role="menuitemradio" aria-checked="false" data-media-block-mode="body">
                                <span class="media-block-option-name">본문 이미지만</span>
                                <span class="media-block-option-desc">본문 이미지를 차단하고 댓글 이모티콘은 표시</span>
                            </button>
                            <button class="media-block-option" type="button" role="menuitemradio" aria-checked="false" data-media-block-mode="all">
                                <span class="media-block-option-name">본문 이미지까지</span>
                                <span class="media-block-option-desc">이모티콘과 본문 이미지 모두 차단</span>
                            </button>
                        </div>
                    </div>
                    <button class="theme-toggle" type="button" aria-label="테마 전환" title="테마 전환">
                        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>
                        </svg>
                        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M20.2 14.6A8.2 8.2 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/>
                        </svg>
                    </button>
                </div>
            </div>
            {% block masthead_context %}{% endblock %}
        </header>

        <main class="page{% block page_class %}{% endblock %}" id="content">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-foot">
            <span>읽기 전용 미러</span>
        </footer>
    </div>
    <script src="{{ static_url('javascript/read_state.js') }}"></script>
</body>
</html>
